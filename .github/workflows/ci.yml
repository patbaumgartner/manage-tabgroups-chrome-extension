name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled to save minutes, but every pushed
  # commit is allowed to finish so that each one leaves a downloadable build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate the extension bundle
        run: npm run validate

  e2e:
    name: End-to-end in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report the browser under test
        run: google-chrome --version

      - name: Load the extension into Chrome and exercise it
        run: npm run e2e

  package:
    name: Reproducible package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the extension archive
        run: npm run build

      - name: Verify the build is reproducible
        run: |
          first=$(cut -d' ' -f1 dist/*.sha256)
          npm run build --silent > /dev/null
          second=$(cut -d' ' -f1 dist/*.sha256)
          if [ "$first" != "$second" ]; then
            echo "::error::The build is not reproducible: $first != $second"
            exit 1
          fi
          {
            echo "### Extension build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Archive | \`$(basename dist/*.zip)\` |"
            echo "| SHA-256 | \`$first\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manage-tabgroups-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  snapshot:
    name: Publish snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, e2e, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # A snapshot always represents the tip of main. If two pushes land close
    # together, cancelling the older run avoids two jobs racing to move the
    # rolling tag and leaving the release pointing at the wrong commit.
    concurrency:
      group: snapshot
      cancel-in-progress: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the extension archive
        run: npm run build

      - name: Assemble the snapshot files
        run: |
          mkdir -p snapshot
          cp dist/*.zip snapshot/manage-tabgroups-snapshot.zip
          cd snapshot
          sha256sum manage-tabgroups-snapshot.zip > manage-tabgroups-snapshot.zip.sha256

      - name: Publish the rolling snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          checksum=$(cut -d' ' -f1 snapshot/manage-tabgroups-snapshot.zip.sha256)
          {
            echo "Automatic build of the latest commit on \`main\`. Unreleased and"
            echo "unsigned: for a stable version use the newest tagged release instead."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| Manifest version | \`${version}\` |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| SHA-256 | \`${checksum}\` |"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "sha256sum -c manage-tabgroups-snapshot.zip.sha256"
            echo '```'
            echo
            echo "Unzip it into a folder you intend to keep, open your browser's"
            echo "extensions page, enable Developer mode, and choose **Load unpacked**."
            echo
            echo "This release is replaced on every push to \`main\`."
          } > snapshot-notes.md

          # The tag is rolling, so the previous snapshot and its tag are removed
          # before the new one is created. Releases tagged v*.*.* are untouched.
          gh release delete snapshot --yes --cleanup-tag 2>/dev/null || true
          gh release create snapshot snapshot/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Snapshot of main (${GITHUB_SHA:0:7})" \
            --notes-file snapshot-notes.md \
            --prerelease

          {
            echo "### Snapshot published"
            echo
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/snapshot"
          } >> "$GITHUB_STEP_SUMMARY"
